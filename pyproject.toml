[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-across-time"
version = "0.1.0"
description = "Reproducible Britannica–Wikipedia comparisons using the required Nemotron and Hermes stack"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.6,<3", "typer>=0.15,<1",
  "pyarrow>=18,<25", "lancedb>=0.20,<1", "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
kat = "kat.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
